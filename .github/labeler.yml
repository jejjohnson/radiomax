# PR auto-labeling rules.
#
# Applied by .github/workflows/label-pr.yml using actions/labeler.
# Labels referenced here must exist — run `uv run poe gh-labels` to create them.
# The `dependencies` label is also created by the bootstrap script so this
# file works on a fresh repo with no manual label setup.
#
# Scopes below map file paths to the standard taxonomy:
#   area:*   — which part of the project the change touches
#   type:*   — left to issue templates (NOT auto-applied on PRs)

"area:engineering":
  - changed-files:
    - any-glob-to-any-file:
      - ".github/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"

"area:docs":
  - changed-files:
    - any-glob-to-any-file:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"

"area:testing":
  - changed-files:
    - any-glob-to-any-file: "tests/**"

# One area per public module; the private code lives in src/radiomax/_src/<module>/.
"area:backend":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/_src/backend.py"
      - "src/radiomax/_src/labelled.py"

"area:geometry":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/geometry.py"
      - "src/radiomax/_src/geometry/**"

"area:radiometry":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/radiometry.py"
      - "src/radiomax/_src/radiometry/**"

"area:thermal":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/thermal.py"
      - "src/radiomax/_src/thermal/**"

"area:retrievals":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/retrievals.py"
      - "src/radiomax/_src/retrievals/**"

"area:sar":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/sar.py"
      - "src/radiomax/_src/sar/**"

"area:altimetry":
  - changed-files:
    - any-glob-to-any-file:
      - "src/radiomax/altimetry.py"
      - "src/radiomax/_src/altimetry/**"

# --- Default / legacy labels retained for Dependabot compatibility ---------

"dependencies":
  - changed-files:
    - any-glob-to-any-file:
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "uv.lock"
