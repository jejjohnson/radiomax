name: Tests

on:
  push:
    branches: [main]
  # every pull request, whatever its base, so stacked PRs are tested too
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --all-groups
      - name: Run tests with coverage
        run: uv run pytest -v
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  test-without-jax:
    name: without JAX and xarray
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      # The base install: an environment of its own, so no test group brings
      # JAX or xarray in through a reference library.
      # cyclopts and loguru are for the docs-script tests.
      - name: Install the package and pytest, no extras
        run: |
          uv venv /tmp/base
          uv pip install --python /tmp/base . pytest hypothesis array-api-strict cyclopts loguru
      - name: Assert that JAX and xarray are not installed
        run: >-
          /tmp/base/bin/python -c
          "import importlib.util as u, sys; sys.exit(any(map(u.find_spec, ('jax', 'xarray'))))"
      - name: Run the tests without them
        run: /tmp/base/bin/python -m pytest -o addopts= tests
